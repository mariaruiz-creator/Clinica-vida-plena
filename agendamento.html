<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Clínica Vida Plena</title>
</head>

<body>
    <header>
        <h1>Clínica Vida Plena</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="agendamento.html">agendamento</a>
        </nav>
    </header>

    <main>
        <h2>Agende a sua consulta.</h2>
        <form action="#" method="post">
            <label for="Nome">Nome Completo</label>
            <input type="text" name="Nome" id="Nome" required>
            <br>
            <label for="email">Email</label>
            <input type="email" name="email" id="email">
            <br>
            <label for="telefone">Telefone</label>
            <input 
            type="tel" 
            name="telefone"
             id="telefone" 
             required
             inputmode="numeric"
             maxlength="15"
             pattern="(?:\(?[1-9]{2}\)?\s?)?(?:9\d{4}|\d{4})-?\d{4}"
             title="Digite com DDD. Ex: (17) 98765-4321 ou 179817654321"
             >
            <br>
            <label for="data">Data:</label>
            <input type="date" name="data" id="data" required>
            <br>
            <label for="hora">Horário:</label>
            <input type="time" name="hora" id="hora" required>
            <br>
            <label for="esprecialidades">Esprecialidades:</label>
            <select name="esprecialidades" id="esprecialidades" required  >
                <option value="">Selecione uma opção</option>
                <option value="clnico-geral">Clínico Geral</option>
                <option value="cardiologia">Cardiologia</option>
                <option value="dermatologia">Desmatologia</option>
                <option value="pediatria">Pediatria</option>
            </select>
            <br>
            <label for="mensagem">Mensagem:</label>
            <textarea name="mensagem" id="mensagem" rows="4"></textarea>
            <br>
            <button type="submit">Confirmar o agendamento</button>
        </form>
    </main>

    <footer>
        <p>
            Clínica Vida Plena - Todos os diretos reservados.
        </p>
    </footer>
</body>

</html>
